<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Kairos</title>
</head>
<body>
  <!-- Provisório: o visual vem na etapa 2. -->
  <main>
    <h1>Kairos</h1>
    {% if form.errors %}
      <p role="alert">Usuário ou senha incorretos.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <p>
        <label for="id_username">Usuário</label>
        <input id="id_username" name="username" autocomplete="username" required autofocus>
      </p>
      <p>
        <label for="id_password">Senha</label>
        <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      </p>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
